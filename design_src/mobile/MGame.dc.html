<div style="width: 82px; height: 82px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #3a2a1e, #1a120d); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; box-shadow: inset 0 1px 0 rgba(255,220,170,.15)">

<div style="font-size: 12px; color: #ffe2b0">مرحله‌ی ۷</div>

<a href="MComplete.dc.html" style="height: 52px; padding: 0 32px; border-radius: 26px; background: linear-gradient(#ffb45a, #ff8a2b); color: #1c0e05; font-size: 15px; font-weight: 600; display: flex; align-items: center">ادامه</a>

<script type="text/x-dc" data-dc-script data-props='{"lightOnLoad":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  fa(n) { return String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]); }
  static MAP = [
    "####E####",
    "#.......#",
    "#.#.#.#.#",
    "#.#...#.#",
    "#.###.#.#",
    "#...#...#",
    "###.#.###",
    "#...#...#",
    "#.###.#.#",
    "#.#...#.#",
    "#.#.###.#",
    "#.......#",
    "#########"
  ];
  static START = { px: 1, py: 11, hunters: [[7, 4], [3, 9]] };
  state = { init: false };
  componentWillUnmount() { clearInterval(this.t); clearInterval(this.mv); }
  eff() {
    if (this.state.init) return this.state;
    const on = this.props.lightOnLoad ?? true;
    return { init: false, px: 1, py: 11, hunters: Component.START.hunters, lit: on, burn: on ? 72 : 0, matches: on ? 5 : 6, picked: false, result: null, drag: null };
  }
  begin() {
    if (this.state.init) return;
    const e = this.eff();
    this.state = Object.assign({}, this.state, e, { init: true });
    this.setState(Object.assign({}, e, { init: true }));
    if (e.lit) this.ensureTimer();
  }
  wall(x, y) { const M = Component.MAP; return y < 0 || y >= M.length || x < 0 || x >= M[0].length || M[y][x] === '#'; }
  ensureTimer() {
    if (this.t) return;
    this.n = 0;
    this.t = setInterval(() => {
      const s = this.state;
      if (s.result || !s.lit) { clearInterval(this.t); this.t = null; return; }
      this.n++;
      const b = s.burn - 1.25;
      if (b <= 0) { clearInterval(this.t); this.t = null; this.setState({ burn: 0, lit: false }); return; }
      if (this.n % 9 === 0) this.moveHunters(b); else this.setState({ burn: b });
    }, 100);
  }
  moveHunters(b) {
    const s = this.state, M = Component.MAP;
    const dist = {}, q = [[s.px, s.py]]; dist[s.px + ',' + s.py] = 0;
    while (q.length) {
      const [x, y] = q.shift(), d = dist[x + ',' + y];
      [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => {
        const nx = x + dx, ny = y + dy, k = nx + ',' + ny;
        if (!this.wall(nx, ny) && M[ny][nx] !== 'E' && dist[k] === undefined) { dist[k] = d + 1; q.push([nx, ny]); }
      });
    }
    let caught = false;
    const hunters = s.hunters.map(([x, y]) => {
      const d = dist[x + ',' + y];
      if (d === undefined || d === 0) return [x, y];
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const k = (x + dx) + ',' + (y + dy);
        if (dist[k] === d - 1) { if (d - 1 === 0) caught = true; return [x + dx, y + dy]; }
      }
      return [x, y];
    });
    this.setState({ hunters, burn: b, result: caught ? 'caught' : null });
    if (caught) this.stopAll();
  }
  stopAll() { clearInterval(this.t); this.t = null; clearInterval(this.mv); this.mv = null; }
  step(dir) {
    const s = this.state;
    if (s.result) return;
    const [dx, dy] = { l: [-1, 0], r: [1, 0], u: [0, -1], d: [0, 1] }[dir];
    const nx = s.px + dx, ny = s.py + dy;
    if (this.wall(nx, ny)) return;
    const M = Component.MAP;
    if (M[ny][nx] === 'E') { this.setState({ px: nx, py: ny, result: 'escaped' }); this.stopAll(); return; }
    const patch = { px: nx, py: ny };
    if (!s.picked && nx === 1 && ny === 7) { patch.picked = true; patch.matches = s.matches + 2; }
    if (s.hunters.some(([hx, hy]) => hx === nx && hy === ny)) { patch.result = 'caught'; this.stopAll(); }
    this.setState(patch);
  }
  local(ev) {
    const r = ev.currentTarget.getBoundingClientRect();
    return [(ev.clientX - r.left) * 390 / r.width, (ev.clientY - r.top) * 844 / r.height];
  }
  down(ev) {
    this.begin();
    if (this.state.result) return;
    const [x, y] = this.local(ev);
    try { ev.currentTarget.setPointerCapture(ev.pointerId); } catch (err) {}
    this.ox = x; this.oy = y; this.dir = null;
    this.setState({ drag: { ox: x, oy: y, kx: 0, ky: 0 } });
    clearInterval(this.mv);
    this.mv = setInterval(() => { if (this.dir) this.step(this.dir); }, 170);
  }
  move(ev) {
    if (!this.state.drag) return;
    const [x, y] = this.local(ev);
    let dx = x - this.ox, dy = y - this.oy;
    const m = Math.hypot(dx, dy), max = 30;
    const kx = m > max ? dx / m * max : dx, ky = m > max ? dy / m * max : dy;
    let dir = null;
    if (m > 16) dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'r' : 'l') : (dy > 0 ? 'd' : 'u');
    if (dir && dir !== this.dir) { this.dir = dir; this.step(dir); } else this.dir = dir;
    this.setState({ drag: { ox: this.ox, oy: this.oy, kx, ky } });
  }
  up() { clearInterval(this.mv); this.mv = null; this.dir = null; if (this.state.drag) this.setState({ drag: null }); }
  strike() {
    this.begin();
    const s = this.state;
    if (s.result || (s.lit && this.t) || s.matches <= 0) { if (s.lit && !this.t) this.ensureTimer(); return; }
    this.setState({ lit: true, burn: 100, matches: s.matches - 1 });
    this.state = Object.assign({}, this.state, { lit: true, burn: 100 });
    this.ensureTimer();
  }
  renderVals() {
    const e = this.eff();
    const M = Component.MAP, C = 40, H = 12, MX = 15, MY = 150;
    const shades = ['linear-gradient(165deg, #6e5a48, #55453a)', 'linear-gradient(165deg, #655243, #4d3f35)', 'linear-gradient(165deg, #74604d, #5a493c)'];
    const walls = [];
    for (let r = 0; r < M.length; r++) for (let c = 0; c < M[r].length; c++) {
      const ch = M[r][c];
      if (ch === '#' || ch === 'E') walls.push({ x: c * C, top: r * C - H, front: r * C + C - H, z: r * 10 + 5, bg: shades[(r * 7 + c * 3) % 3] });
    }
    const hunters = e.hunters.map(([c, r]) => ({
      x: c * C + C / 2 - 13, y: r * C + C / 2 - 34, z: r * 10 + 6, alert: e.lit,
      eye: e.lit ? '#ff4a2a' : '#5a2a1e', glow: e.lit ? '0 0 7px 2px rgba(255,80,40,.8)' : 'none'
    }));
    const pl = { x: e.px * C + C / 2 - 12, y: e.py * C + C / 2 - 30, z: e.py * 10 + 6 };
    const cx = MX + e.px * C + C / 2, cy = MY + e.py * C + C / 2 - 12;
    let overlay;
    if (e.lit) {
      const R = 200 + 6.5 * e.burn;
      overlay = `radial-gradient(circle at ${cx}px ${cy}px, rgba(255,170,90,.10) 0px, rgba(0,0,0,0) ${R * 0.3}px, rgba(8,5,3,.55) ${R * 0.72}px, rgba(6,4,3,.95) ${R}px)`;
    } else {
      overlay = `radial-gradient(circle at ${cx}px ${cy}px, rgba(6,4,3,.45) 0px, rgba(6,4,3,.985) 48px)`;
    }
    const warm = `radial-gradient(circle at ${cx}px ${cy}px, rgba(255,150,60,.16), rgba(255,150,60,0) ${180 + 3 * e.burn}px)`;
    const d = e.drag;
    const joy = d ? { rx: d.ox - 40, ry: d.oy - 40, kx: d.ox + d.kx - 18, ky: d.oy + d.ky - 18 } : { rx: 0, ry: 0, kx: 0, ky: 0 };
    const deg = Math.round(e.burn * 3.6);
    const canStrike = !e.result && e.matches > 0 && !(e.lit && e.init);
    let hint;
    if (!e.init) hint = 'روی کبریت بزن تا اتاق روشن شود. شکارچی‌ها هم نورش را می‌بینند.';
    else if (e.lit) hint = 'شعله‌ات را دیدند. از حرکت نایست.';
    else if (e.matches > 0) hint = 'در تاریکی راهت را پیدا کن، یا کبریت دیگری بزن.';
    else hint = 'کبریتی نمانده. به حافظه‌ات اعتماد کن.';
    return {
      walls, hunters, pl, overlay, warm, joy, lit: e.lit,
      showPickup: !e.picked,
      dragging: !!d,
      escaped: e.result === 'escaped', caught: e.result === 'caught',
      empty: e.init && !e.lit && e.matches === 0 && !e.result,
      matches: this.fa(e.matches), matchAria: `${this.fa(e.matches)} کبریت باقی مانده`,
      burnPct: e.burn, doorGlow: e.lit ? 0.25 : 0.8, hint,
      ring: e.lit ? `conic-gradient(#ffb45a ${deg}deg, rgba(239,227,208,.14) 0deg)` : (e.matches > 0 ? 'linear-gradient(#ffb45a, #ff8a2b)' : 'rgba(239,227,208,.14)'),
      strikeLabel: e.lit ? `${this.fa(Math.ceil(e.burn / 100 * 8))} ثانیه` : 'روشن کن',
      strikeAria: e.lit ? 'کبریت در حال سوختن' : 'کبریت بزن',
      noStrike: !canStrike && e.init,
      down: (ev) => this.down(ev), move: (ev) => this.move(ev), up: () => this.up(),
      stop: (ev) => ev.stopPropagation(),
      strike: () => this.strike()
    };
  }
}
</script>
</body>
