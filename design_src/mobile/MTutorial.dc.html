<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  fa(n) { return String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]); }
  static STEPS = [
    ['برای حرکت، بکش', 'انگشتت را هر جای صفحه بگذار و به سمتی که می‌خواهی بروی بکش. نگه داری، به راه رفتن ادامه می‌دهی. نه دکمه‌ای لازم است، نه دسته‌ای که دنبالش بگردی.'],
    ['کبریت بزن تا ببینی', 'اتاق‌ها کاملاً تاریک‌اند. روی کبریت بزن تا همه‌جا چند ثانیه روشن شود — بعد خاموش می‌شود. کبریت‌ها محدودند، پس لحظه‌هایت را خوب انتخاب کن.'],
    ['شکارچی‌ها دنبال نور می‌آیند', 'شکارچی‌ها در تاریکی بی‌حرکت می‌ایستند. همین که کبریت بزنی، به سمت شعله‌ات راه می‌افتند. بگذار خاموش شود تا بایستند.'],
    ['در را پیدا کن', 'هر اتاق فقط یک راه خروج دارد و نور از زیر درش بیرون می‌زند. بسته‌های کبریت اضافه در بن‌بست‌ها پنهان‌اند.']
  ];
  state = { step: 0 };
  renderVals() {
    const s = this.state.step, S = Component.STEPS;
    return {
      num: this.fa(s + 1), title: S[s][0], body: S[s][1],
      s1: s === 0, s2: s === 1, s3: s === 2, s4: s === 3,
      dots: S.map((_, i) => ({ w: i === s ? 22 : 6, bg: i === s ? '#ff8a2b' : 'rgba(239,227,208,.22)' })),
      first: s === 0, backColor: s === 0 ? 'rgba(239,227,208,.35)' : '#efe3d0',
      notLast: s < 3, last: s === 3,
      next: () => this.setState({ step: Math.min(3, s + 1) }),
      back: () => this.setState({ step: Math.max(0, s - 1) })
    };
  }
}
</script>
