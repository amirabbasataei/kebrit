<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>کبریت — توقف</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&amp;family=Noto+Naskh+Arabic:wght@500;600;700&amp;family=Lalezar&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#efe3d0;text-decoration:none}a:hover{color:#ffd27a}
.row:hover{background:rgba(255,210,150,.06)}
button:focus-visible,a:focus-visible{outline:2px solid #ffd27a;outline-offset:3px}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0a0706; font-family: 'Vazirmatn', sans-serif; color: #efe3d0">

<div aria-hidden="true" style="position: absolute; left: 15px; top: 150px; width: 360px; height: 520px; filter: blur(3px); background-color: #2a211b">
<sc-for list="{{walls}}" as="w" hint-placeholder-count="60">
<div style="position: absolute; left: {{w.x}}px; top: {{w.front}}px; width: 40px; height: 12px; z-index: {{w.z}}; background: #2e231b"></div>
<div style="position: absolute; left: {{w.x}}px; top: {{w.top}}px; width: 40px; height: 40px; z-index: {{w.z}}; background: {{w.bg}}"></div>
</sc-for>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(circle at 75px 590px, rgba(255,170,90,.06) 0, rgba(8,5,3,.7) 300px, rgba(6,4,3,.94) 700px)"></div>

<div style="position: absolute; left: 24px; right: 24px; top: 64px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 11px; color: #bfa688">مرحله‌ی ۷ · سرداب زیرین</div>
<h1 style="margin: 0; font-family: 'Noto Naskh Arabic', serif; font-size: 52px; font-weight: 600; line-height: 1.5; color: #f3e6d2">توقف</h1>
<div style="font-size: 14px; color: #c9b393">شعله‌ات با ۶ ثانیه‌ی باقی‌مانده منتظر است · ۵ کبریت در دست.</div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 24px 24px 36px; border-radius: 24px 24px 0 0; background: linear-gradient(170deg, #241b15, #120d0a); border-top: 1px solid rgba(239,227,208,.12); box-shadow: 0 -20px 50px rgba(0,0,0,.5); display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 11px; color: #bfa688; padding-bottom: 6px">تنظیمات</div>
<sc-for list="{{toggles}}" as="t" hint-placeholder-count="4">
<button type="button" class="row" onClick="{{t.flip}}" aria-pressed="{{t.on}}" style="display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 56px; padding: 6px 12px; margin: 0 -12px; border: none; border-radius: 8px; background: transparent; color: #efe3d0; text-align: right; cursor: pointer; font-family: 'Vazirmatn', sans-serif">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 15px; font-weight: 500">{{t.label}}</div>
<div style="font-size: 12px; color: #a48d72">{{t.desc}}</div>
</div>
<div style="flex-shrink: 0; width: 48px; height: 28px; border-radius: 14px; background: {{t.track}}; position: relative">
<div style="position: absolute; top: 3px; left: {{t.knob}}px; width: 22px; height: 22px; border-radius: 50%; background: #f6ead6; transition: left .15s"></div>
</div>
</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<a href="MGame.dc.html" style="height: 56px; border-radius: 28px; background: linear-gradient(#ffb45a, #ff8a2b); color: #1c0e05; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 24px rgba(255,140,40,.3)">ادامه</a>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<a href="MGame.dc.html" style="height: 48px; border-radius: 24px; border: 1px solid rgba(239,227,208,.24); font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center">از نو</a>
<a href="MTutorial.dc.html" style="height: 48px; border-radius: 24px; border: 1px solid rgba(239,227,208,.24); font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center">آموزش</a>
<a href="MLevels.dc.html" style="height: 48px; border-radius: 24px; border: 1px solid rgba(239,227,208,.24); font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center">مراحل</a>
</div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  fa(n) { return String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]); }
  static MAP = [
    "####E####", "#.......#", "#.#.#.#.#", "#.#...#.#", "#.###.#.#", "#...#...#", "###.#.###",
    "#...#...#", "#.###.#.#", "#.#...#.#", "#.#.###.#", "#.......#", "#########"
  ];
  state = { haptics: true, sound: true, flicker: false, lefty: false };
  renderVals() {
    const M = Component.MAP, C = 40, H = 12;
    const shades = ['linear-gradient(165deg, #6e5a48, #55453a)', 'linear-gradient(165deg, #655243, #4d3f35)', 'linear-gradient(165deg, #74604d, #5a493c)'];
    const walls = [];
    for (let r = 0; r < M.length; r++) for (let c = 0; c < M[r].length; c++) {
      const ch = M[r][c];
      if (ch === '#' || ch === 'E') walls.push({ x: c * C, top: r * C - H, front: r * C + C - H, z: r * 10 + 5, bg: shades[(r * 7 + c * 3) % 3] });
    }
    const defs = [
      ['sound', 'صدا', 'صدای قدم‌ها، کبریت و نفس شکارچی‌ها'],
      ['haptics', 'لرزش گوشی', 'لرزشی کوتاه وقتی شکارچی راه می‌افتد'],
      ['flicker', 'کاهش سوسو', 'نور ثابت به‌جای شعله‌ی لرزان'],
      ['lefty', 'دکمه‌ی کبریت در سمت چپ', 'برای بازی با دست چپ']
    ];
    const toggles = defs.map(([k, label, desc]) => {
      const on = this.state[k];
      return { label, desc, on, track: on ? '#ff8a2b' : 'rgba(239,227,208,.2)', knob: on ? 3 : 23, flip: () => this.setState({ [k]: !this.state[k] }) };
    });
    return { walls, toggles };
  }
}
</script>
</body>
</html>
