<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>کبریت — انتخاب مرحله</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&amp;family=Noto+Naskh+Arabic:wght@500;600;700&amp;family=Lalezar&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#efe3d0;text-decoration:none}a:hover{color:#ffd27a}
@keyframes pulse{0%,100%{box-shadow:0 0 12px 1px rgba(255,150,50,.35)}50%{box-shadow:0 0 22px 4px rgba(255,150,50,.6)}}
.current{animation:pulse 1.8s infinite}
button:focus-visible,a:focus-visible{outline:2px solid #ffd27a;outline-offset:3px}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: radial-gradient(ellipse at 50% 30%, #1e1611 0%, #0a0706 75%); font-family: 'Vazirmatn', sans-serif; color: #efe3d0">

<div style="position: absolute; left: 16px; right: 24px; top: 52px; display: flex; align-items: center; gap: 8px">
<a href="MTitle.dc.html" aria-label="بازگشت به منوی اصلی" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 14 14" fill="none" stroke="#efe3d0" stroke-width="1.6"><path d="M5 2l5 5-5 5"></path></svg></a>
<h1 style="margin: 0; flex-grow: 1; font-family: 'Noto Naskh Arabic', serif; font-size: 32px; font-weight: 600; line-height: 1.5; color: #f3e6d2">به سوی اعماق</h1>
<div style="font-size: 12px; color: #bfa688; text-align: left; line-height: 1.6">۶ از ۱۵ اتاق<br>۱۴ از ۴۵ اخگر</div>
</div>

<div style="position: absolute; left: 26px; right: 26px; top: 122px; display: flex; flex-direction: column; gap: 22px">
<sc-for list="{{chapters}}" as="ch" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; gap: 10px; align-items: baseline">
<div style="font-size: 11px; color: #bfa688">{{ch.num}}</div>
<div style="font-family: 'Noto Naskh Arabic', serif; font-size: 20px; font-weight: 600; color: {{ch.color}}">{{ch.name}}</div>
</div>
<div style="display: flex; gap: 12px">
<sc-for list="{{ch.levels}}" as="l" hint-placeholder-count="5">
<button type="button" onClick="{{l.pick}}" aria-label="{{l.aria}}" style="position: relative; width: 58px; height: 64px; padding: 0; border: none; background: transparent; cursor: pointer; font-family: 'Vazirmatn', sans-serif">
<div style="position: absolute; left: 0; top: 54px; width: 58px; height: 10px; background-color: {{l.front}}; background-image: repeating-linear-gradient(90deg, transparent 0 18px, rgba(0,0,0,.4) 18px 19px); box-shadow: 0 6px 10px rgba(0,0,0,.5)"></div>
<div class="{{l.cls}}" style="position: absolute; left: 0; top: 0; width: 58px; height: 54px; background: {{l.top}}; box-shadow: {{l.ring}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px">
<div style="font-family: 'Noto Naskh Arabic', serif; font-size: 22px; font-weight: 600; line-height: 1.5; color: {{l.numColor}}">{{l.label}}</div>
<sc-if value="{{l.locked}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="10" height="12" viewBox="0 0 14 16" fill="none" stroke="#7d6a57" stroke-width="1.8"><rect x="1.5" y="7" width="11" height="8" rx="1.5"></rect><path d="M4 7V5a3 3 0 0 1 6 0v2"></path></svg>
</sc-if>
<sc-if value="{{l.open}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; gap: 3px">
<sc-for list="{{l.embers}}" as="e" hint-placeholder-count="3">
<div style="width: 5px; height: 7px; border-radius: 50% 50% 45% 45%; background: {{e.bg}}; box-shadow: {{e.glow}}"></div>
</sc-for>
</div>
</sc-if>
</div>
<sc-if value="{{l.hunted}}" hint-placeholder-val="{{ false }}">
<div aria-hidden="true" style="position: absolute; right: 4px; top: 4px; width: 6px; height: 6px; border-radius: 50%; background: {{l.eyeColor}}"></div>
</sc-if>
</button>
</sc-for>
</div>
</div>
</sc-for>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 300px; box-sizing: border-box; padding: 24px 24px 36px; border-radius: 24px 24px 0 0; background: linear-gradient(170deg, #241b15, #120d0a); border-top: 1px solid rgba(239,227,208,.12); box-shadow: 0 -20px 50px rgba(0,0,0,.5); display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; gap: 16px; align-items: flex-end">
<div style="font-family: 'Noto Naskh Arabic', serif; font-size: 56px; font-weight: 600; line-height: 1.5; color: {{sel.numColor}}">{{sel.label}}</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 11px; color: #bfa688">{{sel.chapter}}</div>
<div style="font-family: 'Noto Naskh Arabic', serif; font-size: 24px; font-weight: 600; line-height: 1.1">{{sel.name}}</div>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; background: rgba(239,227,208,.05)"><span style="font-size: 11px; color: #bfa688">کبریت</span><span style="font-size: 16px; font-weight: 600">{{sel.matches}}</span></div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; background: rgba(239,227,208,.05)"><span style="font-size: 11px; color: #bfa688">شکارچی</span><span style="font-size: 16px; font-weight: 600">{{sel.hunters}}</span></div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; background: rgba(239,227,208,.05)"><span style="font-size: 11px; color: #bfa688">بهترین</span><span style="font-size: 16px; font-weight: 600">{{sel.best}}</span></div>
</div>
<div style="font-family: 'Noto Naskh Arabic', serif; font-size: 17px; color: #d8c4a6; line-height: 1.5; flex-grow: 1">{{sel.note}}</div>
<sc-if value="{{sel.open}}" hint-placeholder-val="{{ true }}">
<a href="MGame.dc.html" style="height: 56px; border-radius: 28px; background: linear-gradient(#ffb45a, #ff8a2b); color: #1c0e05; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 24px rgba(255,140,40,.35)">{{sel.cta}}</a>
</sc-if>
<sc-if value="{{sel.locked}}" hint-placeholder-val="{{ false }}">
<div style="height: 56px; border-radius: 28px; border: 1px dashed rgba(239,227,208,.25); color: #a48d72; font-size: 14px; display: flex; align-items: center; justify-content: center">برای باز شدن، از مرحله‌ی {{sel.prev}} بگریز</div>
</sc-if>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  fa(n) { return String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]); }
  static LEVELS = [
    [1, 'نخستین نور', 12, 0, 3], [2, 'راه‌های باریک', 11, 0, 3], [3, 'اجاق سرد', 10, 0, 2], [4, 'تاریکی بلند', 9, 0, 3], [5, 'انبار ریشه', 8, 0, 2],
    [6, 'نگهبانان خاموش', 7, 1, 1], [7, 'سرداب زیرین', 6, 2, 0], [8, 'استخوان‌دان', 5, 3, 0], [9, 'تالار استخوان', 5, 3, 0], [10, 'سرای نگهبانان', 4, 3, 0],
    [11, 'پله‌های غرقه', 4, 4, 0], [12, 'گورهای فانوس', 4, 4, 0], [13, 'همسرایان تهی', 3, 4, 0], [14, 'دالان‌های خاکستر', 3, 5, 0], [15, 'آخرین در', 2, 5, 0]
  ];
  static CHAPTERS = [['فصل اول', 'خانه‌ی کهنه'], ['فصل دوم', 'سرداب‌ها'], ['فصل سوم', 'دخمه‌ها']];
  static CURRENT = 7;
  state = { sel: 7 };
  status(n) { return n < Component.CURRENT ? 'done' : n === Component.CURRENT ? 'current' : 'locked'; }
  renderVals() {
    const L = Component.LEVELS;
    const pad = (n) => this.fa(n);
    const chapters = Component.CHAPTERS.map((c, ci) => ({
      num: c[0], name: c[1], color: ci <= 1 ? '#f3e6d2' : '#8f7a64',
      levels: L.slice(ci * 5, ci * 5 + 5).map(([n, name, m, h, r]) => {
        const st = this.status(n), selected = this.state.sel === n;
        const embers = [0, 1, 2].map((i) => ({ bg: st === 'done' && i < r ? '#ff8a2b' : 'rgba(239,227,208,.18)', glow: st === 'done' && i < r ? '0 0 5px rgba(255,140,40,.7)' : 'none' }));
        return {
          label: pad(n), embers, locked: st === 'locked', open: st !== 'locked', hunted: h > 0,
          eyeColor: st === 'locked' ? '#5e4d3e' : '#ff5a2e',
          cls: st === 'current' ? 'current' : '',
          top: st === 'locked' ? 'linear-gradient(165deg, #2c231c, #221a15)' : st === 'current' ? 'linear-gradient(165deg, #8a6c50, #6b523d)' : 'linear-gradient(165deg, #6e5a48, #55453a)',
          front: st === 'locked' ? '#17110d' : '#2e231b',
          numColor: st === 'locked' ? '#6b5a49' : '#f6ead6',
          ring: selected ? 'inset 0 0 0 2px #ffd27a, 0 0 18px rgba(255,170,80,.35)' : 'inset 0 1px 0 rgba(255,225,190,.16)',
          aria: `مرحله‌ی ${pad(n)}، ${name}، ${{ done: 'گذرانده‌شده', current: 'مرحله‌ی فعلی', locked: 'قفل' }[st]}`,
          pick: () => this.setState({ sel: n })
        };
      })
    }));
    const [n, name, m, h, r] = L[this.state.sel - 1];
    const st = this.status(n);
    const notes = {
      done: `با ${pad(r)} اخگر از ۳ گریختی. کبریت بیشتری نگه دار تا همه را بگیری.`,
      current: h ? 'شکارچی‌های اینجا بی‌حرکت‌اند — تا وقتی شعله‌ای چشمشان را بگیرد.' : 'پیش از تمام شدن کبریت‌ها در را پیدا کن.',
      locked: 'راه پایین هنوز بسته است.'
    };
    const sel = {
      label: pad(n), name, chapter: Component.CHAPTERS[Math.floor((n - 1) / 5)][1],
      matches: pad(m), hunters: h ? pad(h) : 'ندارد', best: st === 'done' ? `${pad(r)} از ۳` : '—',
      numColor: st === 'locked' ? '#6b5a49' : '#f6ead6',
      note: notes[st], open: st !== 'locked', locked: st === 'locked', prev: pad(n - 1),
      cta: st === 'done' ? 'بازی دوباره' : 'ورود به اتاق'
    };
    return { chapters, sel };
  }
}
</script>
</body>
</html>
